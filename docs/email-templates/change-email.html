<!doctype html>
<html lang="pt-BR">
  <body style="margin:0;background:#071017;color:#eaf4f6;font-family:Arial,sans-serif">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#071017;padding:32px 16px">
      <tr><td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;border:1px solid #30444f;background:#0d1821">
          <tr><td style="padding:32px">
            <p style="margin:0 0 12px;color:#ffc248;font-size:12px;font-weight:700;letter-spacing:1.5px">ALTERAÇÃO DE SEGURANÇA</p>
            <h1 style="margin:0 0 16px;font-size:26px;line-height:1.2">Confirme seu novo e-mail</h1>
            <p style="margin:0 0 24px;color:#b7c8ce;line-height:1.65">Foi solicitada a troca para <strong>{{ .NewEmail }}</strong>. Confirme somente se você iniciou esta alteração.</p>
            <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#a9ff3f;color:#071006;padding:15px 20px;text-decoration:none;font-weight:800">CONFIRMAR NOVO E-MAIL</a>
            <p style="margin:24px 0 0;color:#8297a0;font-size:12px;line-height:1.6">Se você não reconhece a solicitação, não use o link e fale com <a href="{{ .SiteURL }}/support" style="color:#63eaff">o suporte do Arcadia</a>.</p>
          </td></tr>
        </table>
      </td></tr>
    </table>
  </body>
</html>
